trigger:
- develop
- meadow-*

pool:
  vmImage: ubuntu-latest

steps:
- script: git submodule update --init --recursive
- script: git clean -xfd
- script: docker run --rm -v $PWD:/project -w /project espressif/idf:release-v5.3 ./build.sh --build
- task: CopyFiles@2
  inputs:
    contents: |
      Source/MeadowComms/build/MeadowComms.bin
      Source/MeadowComms/build/MeadowComms.bin.md5
      Source/MeadowComms/build/bootloader/bootloader.bin
      Source/MeadowComms/build/bootloader/bootloader.bin.md5
      Source/MeadowComms/build/partition_table/partition-table.bin
      Source/MeadowComms/build/partition_table/partition-table.bin.md5
    targetFolder: '$(Build.ArtifactStagingDirectory)/release'
    flattenFolders: true
- task: CopyFiles@2
  inputs:
    contents: |
      Source/MeadowComms/build/**/?(*.elf|*.map|*.bin|*.md5)
    targetFolder: '$(Build.ArtifactStagingDirectory)/build'
    flattenFolders: false
- task: PublishBuildArtifacts@1
  inputs:
    pathtoPublish: '$(Build.ArtifactStagingDirectory)/release'
    artifactName: network
- task: PublishBuildArtifacts@1
  inputs:
    pathtoPublish: '$(Build.ArtifactStagingDirectory)/build'
    artifactName: build
