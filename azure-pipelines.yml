trigger:
- develop

pool: WL-Linux

steps:
- script: git clean -xfd
- script: cd Source/MeadowComms
- script: pwd && docker run --rm -v $PWD:/project -w /project espressif/idf:release-v4.2 idf.py build
- task: CopyFiles@2
  inputs:
    contents: |
      build/MeadowComms.bin
      build/bootloader/bootloader.bin
      build/partition_table/partition-table.bin
    targetFolder: '$(Build.ArtifactStagingDirectory)'
- task: PublishBuildArtifacts@1
  inputs:
    pathtoPublish: '$(Build.ArtifactStagingDirectory)'
    artifactName: network