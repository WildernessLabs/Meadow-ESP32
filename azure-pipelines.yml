# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- develop

resources:
- repo: self

variables:
  tag: '$(Build.BuildId)'

pool:
  vmImage: ubuntu-latest

container: 
  image: espressif/idf:release-v4.2
  options: -v "$(System.DefaultWorkingDirectory)/Meadow-ESP32/Source/MeadowComms":"/project" -w "/project"

steps:
  - script: idf.py build

