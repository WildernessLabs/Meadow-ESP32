# debug.cfg -- OpenOCD configuration for debugging Meadow-ESP32 over an
# ESP-Prog (FT2232H, JTAG on channel A).  Used by CLion's "Debug (OpenOCD)"
# configuration through tools/clion/openocd, and from the command line:
#
#   tools/clion/openocd -f debug.cfg -c "init; reset halt"
#   tools/clion/gdb -ex 'target extended-remote :3333' build/MeadowComms.elf
#
# The interface and board match flash-app.cfg and flash-all.cfg.  FreeRTOS
# thread awareness is left at Espressif's default (on), so CLion's Threads
# pane lists the tasks.

source [find interface/ftdi/esp_ftdi.cfg]
source [find board/esp-wroom-32.cfg]

# An IDE Stop halts the cores before GDB detaches, which otherwise leaves the
# board frozen after every debug session.  Resume it on detach instead.  The
# curstate check avoids "Not halted" when GDB went away while the core ran.
$_TARGETNAME_0 configure -event gdb-detach {
	if { [$_TARGETNAME_0 curstate] eq "halted" } { resume }
}
