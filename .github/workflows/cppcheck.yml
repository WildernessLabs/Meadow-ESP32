name: cppcheck-action
on: [push]

jobs:
  build:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: cppcheck
        uses: deep5050/cppcheck-action@main
        with:
          github_token: ${{ secrets.CI_ACCESS_TOKEN}}
          check_library:
          skip_preprocessor:
          enable:
          exclude_check: ./Source/MeadowComms/components/esp_littlefs CMakeLists.txt
          inconclusive:
          inline_suppression: enable
          force_language: c, c++
          force: enable
          max_ctu_depth:
          platform:
          std: c11, c++17
          output_file:
          other_options:

      - name: publish report    
        uses: mikeal/publish-to-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.CI_ACCESS_TOKEN }}
          BRANCH_NAME: 'main' # your branch name goes here